# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
  - name: "seo"
    label: "Page titles, descriptions and share picture"
    type: "file"
    path: "src/content/seo.json"
    format: "json"
    description: "What Google, Facebook, WhatsApp and LinkedIn show for each page, service and city."
    fields:
      - name: "site"
        label: "Whole site (defaults)"
        type: "object"
        fields:
          - name: "name"
            label: "Name"
            type: "string"
          - name: "url"
            label: "Web address"
            type: "string"
          - name: "image"
            label: "Share picture (1200 × 630)"
            type: "image"
          - name: "imageAlt"
            label: "What the picture shows (for screen readers)"
            type: "string"
          - name: "locale"
            label: "Main language code"
            type: "string"
          - name: "localeAlternate"
            label: "Second language code"
            type: "string"
      - name: "pages"
        label: "Pages"
        type: "object"
        list: true
        fields:
          - name: "path"
            label: "Page address"
            description: "For example /about. Do not change."
            type: "string"
          - name: "title"
            label: "Title (under 65 characters)"
            type: "string"
          - name: "description"
            label: "Description (120 to 160 characters)"
            type: "text"
