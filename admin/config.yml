# Run "npm run cms:config" after adding content files or fields.
# Sveltia CMS at https://alcleaningpro.ca/admin/ — editor for people with a GitHub account.
# Sign in with "Sign In Using Access Token".
# Access token: fine-grained GitHub token for jacquesmofa/AL-Cleaning (Contents: read and write).
site_url: "https://alcleaningpro.ca"
logo_url: "https://alcleaningpro.ca/icon-192.png"
backend:
  name: "github"
  repo: "jacquesmofa/AL-Cleaning"
  branch: "main"
media_folder: "public/media/uploads"
public_folder: "/media/uploads"
collections:
  - name: "settings"
    label: "Google and sharing"
    files:
      - name: "seo"
        label: "Page titles, descriptions and share picture"
        file: "src/content/seo.json"
        format: "json"
        fields:
          - name: "site"
            label: "Whole site (defaults)"
            required: false
            widget: "object"
            fields:
              - name: "name"
                label: "Name"
                required: false
                widget: "string"
              - name: "url"
                label: "Web address"
                required: false
                widget: "string"
              - name: "image"
                label: "Share picture (1200 × 630)"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "string"
              - name: "locale"
                label: "Main language code"
                required: false
                widget: "string"
              - name: "localeAlternate"
                label: "Second language code"
                required: false
                widget: "string"
          - name: "pages"
            label: "Pages"
            required: false
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "path"
                label: "Page address"
                required: false
                hint: "For example /about. Do not change."
                widget: "string"
              - name: "title"
                label: "Title (under 65 characters)"
                required: false
                widget: "string"
              - name: "description"
                label: "Description (120 to 160 characters)"
                required: false
                widget: "text"
